name: Run Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:  
  CamusDB-Tests:
    runs-on: "ubuntu-latest"    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
      - name: Run Tests
        timeout-minutes: 30
        run: (chmod +x ./scripts/run-tests.sh && ./scripts/run-tests.sh)
