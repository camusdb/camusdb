# CamusDB configuration reference
#
# Precedence (highest wins): CLI flag > environment variable > config.yml > built-in default.
# Only explicitly provided CLI flags override YAML — omitting a flag keeps the YAML value.
#
# Environment overrides:
#   CAMUS_KEY_RANGE_SHARDING — when set to 1 or true, enables key_range_sharding regardless of YAML.

data_dir: /tmp/camusdb/

# ── Server mode ───────────────────────────────────────────────────────────────
# mode: standalone         # standalone | cluster
# node_name: camus-node-1  # cluster: unique node name (defaults to machine name)
# raft_node_id: 1          # cluster: numeric Raft node id (> 0)
# raft_host: localhost     # cluster: Raft bind/advertise host
# raft_port: 7070          # cluster: Raft gRPC port (1..65535)
initial_partitions: 3      # cluster: Raft partition count (>= 1)
# http_port: 5095          # HTTP API port (1..65535)
# https_port: 7141         # HTTPS API port when https_certificate is set (1..65535)
# https_certificate:       # path to PFX for HTTPS; omit to disable HTTPS
# raft_certificate:        # path to PFX for Raft gRPC TLS in cluster mode

# Cluster mode example (uncomment and fill in)
# mode: cluster
# node_name: camus-node-1
# raft_host: 192.168.1.10
# raft_port: 7070
# initial_partitions: 3
#
# peers: Raft endpoint list.  Each entry MUST be "host:raftPort" exactly as Raft
# reports it — the endpoint-map lookup is a byte-exact string match against the
# leader endpoint string returned by Raft.WaitForLeader().  A mismatch causes a
# silent fallback to the uniform-port heuristic (logged at Warning level).
# peers:
#   - 192.168.1.10:7070
#   - 192.168.1.11:7070
#   - 192.168.1.12:7070
#
# Per-peer HTTP addresses (parallel to peers, same index order).
# Required for heterogeneous HTTP ports or multiple nodes per host.
# If omitted, the leader's host is reused with this node's http_port (uniform-port assumption).
# http_peers:
#   - 192.168.1.10:5095
#   - 192.168.1.11:5095
#   - 192.168.1.12:5095
#
# Schema two-version gate tunables (cluster mode). A DDL proposer waits for every
# live node to ack the previous schema version before proposing the next.
# schema_ack_wait_timeout_ms: how long to wait for all acks before giving up (> 0).
# schema_ack_live_node_lease_ms: how long since a member's last ack before the gate
#   presumes it down and stops blocking on it. -1 = infinite (conservative default:
#   wait on every member); a positive value enables apply-derived liveness expiry.
# schema_ack_wait_timeout_ms: 30000
# schema_ack_live_node_lease_ms: -1

# ── Isolation and locking ─────────────────────────────────────────────────────
# default_isolation_level: serializable       # serializable | read_committed
# default_transaction_locking: pessimistic    # pessimistic | optimistic
# range_lock_expires_ms: 150000           # initial range-lock TTL; must be >= 2x the effective kahuna.collection_interval_ms (60s default) or startup is rejected; <= 0 = no expiry
# max_serializable_transaction_lifetime_ms: 3600000  # <= 0 disables absolute cap; also the Kahuna session timeout (the node's kahuna.max_transaction_timeout_ms is derived from this unless pinned larger)
# lock_escalation_threshold: 50           # shared-point locks before bucket escalation (> 0)
# lock_wait_deadline_ms: 500              # per-operation Serializable conflict cap (> 0)
# key_range_sharding: false               # opt tables into Kahuna key-range routing

# Abandoned explicit-transaction reaper. A client that opens a transaction (/start-transaction)
# and never commits/rolls back would otherwise hold its locks indefinitely (a Serializable+RW
# transaction's heartbeat renews them forever). The reaper rolls back any explicit transaction
# idle — no statement issued — for longer than transaction_idle_timeout_ms.
# transaction_idle_timeout_ms: 300000     # idle cutoff before rollback; <= 0 disables the reaper
# transaction_reaper_interval_ms: 30000   # sweep interval; must be > 0

# ── Schema and transaction limits ─────────────────────────────────────────────
# max_index_columns: max key + INCLUDE columns in one index; <= 0 disables. Default 32.
# max_index_include_tuple_bytes: max encoded bytes of one index entry's key + INCLUDE tuple, checked
#   at write time; <= 0 disables. Default 4096 (4 KiB).
# max_mutations_per_transaction: max rows one user transaction may mutate; <= 0 disables (unlimited);
#   DDL/backfill always run unlimited. Default 20000.
# branch_snapshot_hold_lease_ms: lease window for a branch's snapshot-floor hold on its parent's MVCC
#   history (the leader-owned renewer renews well inside it); must be > 0. Default 300000 (5 min).
# max_index_columns: 32
# max_index_include_tuple_bytes: 4096
# max_mutations_per_transaction: 20000
# branch_snapshot_hold_lease_ms: 300000

# ── Advisory table statistics ─────────────────────────────────────────────────
# Row-count estimates are updated in memory on every DML and flushed to durable storage
# at most once per this interval (milliseconds), per table.
#   0  = flush after every change (highest durability, highest write amplification)
#   -1 = never auto-flush; persist only on explicit flush / database close
#   >0 = cap flush frequency to roughly once per interval per table (default 5000)
# stats_flush_interval_ms: 5000
#
# Manual ANALYZE tuning:
# stats_analyze_sample_rows: full-scan below this row count; sample the first N rows above it.
#   0 = always full scan. Default 100000.
# stats_histogram_buckets: equi-depth histogram buckets built per column (>= 1). Default 100.
# stats_analyze_sample_rows: 100000
# stats_histogram_buckets: 100

# ── Automatic (background) ANALYZE ────────────────────────────────────────────
# Keeps optimizer statistics fresh without a user running ANALYZE. Stays low-priority: it reads a
# lock-free snapshot (never blocks/aborts foreground work), bounds memory with sampling, throttles
# its scan rate, and backs off under load. Off by default. See docs/automatic-analyze.md.
#
# auto_analyze_enabled: master switch. Default false.
# auto_analyze_check_interval_ms: sweep interval; only the registry leader sweeps (once per cluster).
#   <= 0 also disables the loop. Default 60000.
# auto_analyze_fraction_stale_rows: proportional trigger — stale once mutations reach
#   fraction*row_count + min_stale_rows (>= 0). Default 0.20.
# auto_analyze_min_stale_rows: absolute mutation floor before a table is ever stale (>= 0). Default 500.
# auto_analyze_max_concurrent: max background analyses at once on a node (>= 1). Default 1.
# auto_analyze_max_rows_per_second: scan-rate throttle (CPU/IO cap); <= 0 disables. Default 50000.
# auto_analyze_histogram_sample_rows: reservoir sample size per column — the memory bound (>= 1).
#   Default 10000.
# auto_analyze_hll_precision: HyperLogLog index bits for NDV sketches; register count 2^p (4..16).
#   Default 11 (~2 KB/column, ~2.3% error).
# auto_analyze_load_pause_threshold: in-flight foreground work above which the sweep backs off;
#   <= 0 disables load backoff. Default 16.
# auto_analyze_ownership_check_rows: rows between mid-scan ownership/load re-checks (>= 1). Default 1000.
# auto_analyze_enabled: false
# auto_analyze_check_interval_ms: 60000
# auto_analyze_fraction_stale_rows: 0.20
# auto_analyze_min_stale_rows: 500
# auto_analyze_max_concurrent: 1
# auto_analyze_max_rows_per_second: 50000
# auto_analyze_histogram_sample_rows: 10000
# auto_analyze_hll_precision: 11
# auto_analyze_load_pause_threshold: 16
# auto_analyze_ownership_check_rows: 1000

# ── SQL parser AST cache ──────────────────────────────────────────────────────
# Identical SQL texts skip lexing+parsing on the second and later executions.
# sql_parser_cache_ttl_seconds: sliding TTL in seconds; 0 disables the cache. Default: 300.
# sql_parser_cache_max_entries: cap on distinct SQL texts; 0 = unbounded. Default: 2048.
# sql_parser_cache_sweep_seconds: background sweep interval; must be > 0. Default: 60.
# sql_parser_cache_ttl_seconds: 300
# sql_parser_cache_max_entries: 2048
# sql_parser_cache_sweep_seconds: 60

# ── Recoverable drops (deferred DROP + orphan reclamation) ────────────────────
# A non-FORCE DROP DATABASE/TABLE (root only) retains the object's data as a recoverable orphan,
# recoverable via CREATE ... RELINK TO '<id>' (see SHOW ORPHAN DATABASES / SHOW ORPHAN TABLES),
# until the background garbage collector reclaims it.
# orphan_retention_ms: how long an orphan stays recoverable before the GC may physically delete it;
#   <= 0 keeps orphans until an explicit DROP ... FORCE / manual purge. Default: 604800000 (7 days).
# orphan_reclaim_interval_ms: GC sweep interval; <= 0 disables the loop. Default: 300000 (5 min).
# orphan_retention_ms: 604800000
# orphan_reclaim_interval_ms: 300000

# ── Spill-to-disk ─────────────────────────────────────────────────────────────
# When spill_enabled is false (default), all blocking operators (sort, GROUP BY, DISTINCT,
# hash join, derived-table materialization, DELETE/UPDATE row buffers) keep their existing
# in-memory behavior. When true, each operator writes sorted runs or partitioned rows to
# temp files under {data_dir}/tmp/spill/ once its buffer exceeds spill_threshold_rows.
# Spill files are always deleted on operator completion, cancellation, or exception;
# orphaned files from a prior crash are swept on the next startup.
#
# spill_enabled: false            # gate all spill behavior; default false
# spill_threshold_rows: 500000    # per-operator row cap before spilling; must be > 0
# spill_merge_fan_in: 16          # max simultaneous run readers in a k-way merge; must be > 0

# ── Cost-based optimizer ──────────────────────────────────────────────────────
# cost_based_access_path_enabled: false   # cost all index access paths, pick cheapest
# cost_based_join_order_enabled: false    # System-R DP join-order enumeration
# plan_cache_enabled: false               # SQL plan cache (reuse parsed+planned queries)
# plan_cache_max_entries: 512             # max LRU entries in the plan cache

# ── Regex match operators (~, ~*, !~, !~*) ────────────────────────────────────
# regex_match_timeout_ms: per-match timeout guarding against ReDoS on pathological patterns;
#   a match that exceeds it is rejected rather than allowed to run unbounded. Must be > 0.
# regex_cache_max_entries: max compiled patterns cached (keyed by pattern + case-sensitivity);
#   0 disables caching (patterns still compile+evaluate, just aren't retained).
# regex_match_timeout_ms: 250
# regex_cache_max_entries: 1024

# ── Query result cache ────────────────────────────────────────────────────────
# On by default; opt-in per query via a {cache=name} hint. Nothing without a hint is cached.
# See docs/query-result-cache.md for the full reference.
# query_result_cache_enabled: true              # master switch; set false to disable entirely
# query_result_cache_default_ttl_ms: 5000       # TTL for entries without a per-hint ttl=
# query_result_cache_max_entries: 1024          # entry-count cap (LRU beyond it)
# query_result_cache_max_bytes: 67108864        # total byte budget across entries (64 MiB)
# query_result_cache_max_entry_bytes: 1048576   # per-entry byte cap; larger results not stored
# query_result_cache_max_entry_rows: 10000      # per-entry row cap; larger results not stored
# query_result_cache_strict_validation_max_keys: 10000  # probe budget for strict validation
# query_result_cache_sweep_interval_ms: 10000   # background TTL-sweep interval

# ── Kahuna engine (cluster and standalone) ────────────────────────────────────
# Allow-listed passthrough to EmbeddedKahunaOptions. Omit the section or any key to
# keep the mode-specific CamusDB baseline. Both modes default to rocksdb for KV and WAL:
#   standalone — rocksdb for both KV and WAL.
#   cluster    — rocksdb for both KV and WAL, plus election 2000/4000 ms.
# Any key you set below overrides that baseline. Unknown keys are rejected at startup.
#
# Storage backends:
#   memory   — no persistence; data is lost on restart. Dev/test only.
#   sqlite   — per-partition files {storage_path}/kahuna{N}_{revision}.db (opt-in override).
#   rocksdb  — higher write throughput; directory tree under {storage_path}/{revision}/
#              (default for both modes; recommended for write-heavy workloads).
#
# wal_sync_writes (default true) fsyncs the WAL on every write for crash durability. On macOS/APFS
# an fsync is ~10 ms, so a write-heavy load (many autocommits, or a large batch whose commit is not
# group-fsynced) can be dominated by fsync latency. Set it false for dev/bulk loads to trade that
# durability for a large speedup; keep it true in production.
#
# To opt out of the rocksdb default and use sqlite for both KV and WAL:
# kahuna:
#   storage: sqlite
#   wal_storage: sqlite
#
# kahuna:
#   storage: rocksdb             # memory | sqlite | rocksdb (default rocksdb)
#   storage_revision: v1
#   wal_storage: rocksdb          # memory | sqlite | rocksdb (default rocksdb)
#   wal_revision: v1
#   wal_sync_writes: true
#   default_transaction_timeout_ms: 5000
#   max_transaction_timeout_ms: 3600000  # hard cap on any session timeout; must be >= max_serializable_transaction_lifetime_ms. Unset => derived from that lifetime so a long serializable txn is not clamped/reaped early
#   locks_workers: 8
#   key_value_workers: 8
#   background_writer_workers: 1
#   read_io_threads: 8
#   write_io_threads: 8
#   start_election_timeout_ms: 2000    # must be < end_election_timeout_ms
#   end_election_timeout_ms: 4000
#   start_election_timeout_increment_ms: 100
#   end_election_timeout_increment_ms: 200
#   heartbeat_interval_ms: 500
#   voting_timeout_ms: 1500
#   max_entries_per_actor: 50000        # size-based eviction: cap on in-memory entries per actor
#   max_bytes_per_actor: 268435456      # size-based eviction: cap on in-memory bytes per actor (256 MiB)
#   cache_entry_ttl_ms: 300000          # idle TTL before an aged cache entry may be evicted (5 min)
#   cache_entries_to_remove: 1000       # max aged entries evicted per collection sweep
#   collection_interval_ms: 60000       # background eviction-sweep + range-lock renewal cadence (60 s); range_lock_expires_ms must be >= 2x this
#   compact_every_operations: 1000      # take a Raft-log compaction point every N operations
#   compact_number_entries: 50          # trailing log entries retained at each compaction point
#   max_entries_per_compaction: 5000    # cap on entries removed by a single compaction pass
#
#   # RocksDB memory sharing (default: on whenever storage AND wal_storage are rocksdb;
#   # a no-op otherwise). One block cache + one write-buffer manager serve both databases,
#   # bounding total RocksDB memory with a single budget instead of two.
#   rocksdb_shared_memory: true                 # set false to give each database its own budget
#   rocksdb_shared_memory_budget_mb: 320        # total shared block-cache budget (MiB)
#   rocksdb_shared_memtable_budget_mb: 128      # memtable sub-budget (MiB); must be <= the total
