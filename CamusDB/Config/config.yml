# CamusDB configuration reference
#
# This file is the annotated reference used by a source checkout and by the container image, and it
# is tracked in git — a pull or a checkout can replace whatever you edit here. It is NOT where an
# installed node should keep its settings: run `camusdb init` to write a short, user-owned file to
# ~/.camusdb/config.yml, which no checkout can touch. The reference is also published at
# https://camusdb.github.io/docs/configuration/
#
# CamusDB reads the first configuration it finds:
#   1. --config <path>
#   2. the CAMUS_CONFIG_PATH environment variable
#   3. ./camusdb.yml or ./Config/config.yml   (this file, when started from the repository root)
#   4. ~/.camusdb/config.yml                  (%APPDATA%\camusdb\config.yml on Windows)
#   5. built-in defaults, when no file exists anywhere
# A path named explicitly by 1 or 2 must exist; startup fails rather than falling through to another
# file. Setting CAMUS_HOME relocates both the user configuration and the default data directory.
#
# Precedence (highest wins): CLI flag > environment variable > config.yml > built-in default.
# Only explicitly provided CLI flags override YAML — omitting a flag keeps the YAML value.
#
# Environment overrides:
#   CAMUS_KEY_RANGE_SHARDING — when set to 1 or true, enables key_range_sharding regardless of YAML.

data_dir: /tmp/camusdb/

# ── Server mode ───────────────────────────────────────────────────────────────
# mode: standalone         # standalone | cluster
# node_name: camus-node-1  # cluster: unique node name (defaults to machine name)
# raft_node_id: 1          # cluster: numeric Raft node id (> 0)
# raft_host: localhost     # cluster: Raft bind/advertise host
# raft_port: 7070          # cluster: Raft gRPC port (1..65535)
initial_partitions: 1      # Raft partition count (>= 1). Standalone default is 1: a single node has one
                           # disk / one fsync target, so partition fan-out buys nothing — and a single
                           # partition makes every transaction single-participant, enabling the one-phase
                           # commit fast path (one durable barrier per commit instead of two). Measured on
                           # TPC-C (1000 warehouses, 8 clients): 28.8 tx/s with 1 partition + one-phase vs
                           # 7.0 tx/s with 4 partitions (commit p50 7.6 ms vs ~107 ms). Raise only for
                           # cluster deployments, where partitions map to distinct leaders.
# http_port: 5095          # HTTP API port (1..65535)
# https_port: 7141         # HTTPS API port when https_certificate is set (1..65535)
# https_certificate:       # path to PFX for HTTPS; omit to disable HTTPS
# raft_certificate:        # path to PFX for Raft gRPC TLS in cluster mode

# ── Authentication transport security ─────────────────────────────────────────
# Authentication itself is switched on with the CAMUSDB_AUTH_ENABLED environment variable, and its
# secrets (token key, bootstrap credentials, node secret) are read only from the environment so they
# never sit in this file. This flag carries no secret — it is deployment topology — so it lives here.
#
# require_tls_when_auth_enabled (default true): with authentication on, reject credential-bearing
#   requests that arrive over plaintext HTTP/h2c, since a bearer token on the wire is trivially
#   stolen. Loopback peers are always exempt, so local development needs no certificate. Set false
#   ONLY when TLS terminates in front of the node (ingress, sidecar, service mesh): that hop is
#   invisible to the server, so it would otherwise reject every forwarded request. Also settable as
#   --require-tls-when-auth-enabled true|false, which overrides this value.
# require_tls_when_auth_enabled: true

# Cluster mode example (uncomment and fill in)
# mode: cluster
# node_name: camus-node-1
# raft_host: 192.168.1.10
# raft_port: 7070
# initial_partitions: 3
#
# peers: Raft endpoint list.  Each entry MUST be "host:raftPort" exactly as Raft
# reports it — the endpoint-map lookup is a byte-exact string match against the
# leader endpoint string returned by Raft.WaitForLeader().  A mismatch causes a
# silent fallback to the uniform-port heuristic (logged at Warning level).
# peers:
#   - 192.168.1.10:7070
#   - 192.168.1.11:7070
#   - 192.168.1.12:7070
#
# Per-peer HTTP addresses (parallel to peers, same index order).
# Required for heterogeneous HTTP ports or multiple nodes per host.
# If omitted, the leader's host is reused with this node's http_port (uniform-port assumption).
# http_peers:
#   - 192.168.1.10:5095
#   - 192.168.1.11:5095
#   - 192.168.1.12:5095
#
# Schema two-version gate tunables (cluster mode). A DDL proposer waits for every
# live node to ack the previous schema version before proposing the next.
# schema_ack_wait_timeout_ms: how long to wait for all acks before giving up (> 0).
# schema_ack_live_node_lease_ms: how long since a member's last ack before the gate
#   presumes it down and stops blocking on it. -1 = infinite (conservative default:
#   wait on every member); a positive value enables apply-derived liveness expiry.
# schema_ack_wait_timeout_ms: 30000
# schema_ack_live_node_lease_ms: -1

# ── Isolation and locking ─────────────────────────────────────────────────────
# default_isolation_level: serializable       # serializable | read_committed
# default_transaction_locking: pessimistic    # pessimistic | optimistic
# default_transaction_priority: normal        # background | low | normal | high | critical; consulted only when kahuna.max_concurrent_sessions sets a ceiling
# transaction_admission_wait_ms: 0            # how long a transaction queues at the admission gate before a retryable refusal; 0 = use kahuna.default_admission_wait_ms. NOT the transaction lifetime
# range_lock_expires_ms: 150000           # initial range-lock TTL; must be >= 2x the effective kahuna.collection_interval_ms (60s default) or startup is rejected; <= 0 = no expiry
# max_serializable_transaction_lifetime_ms: 3600000  # <= 0 disables absolute cap; also the Kahuna session timeout (the node's kahuna.max_transaction_timeout_ms is derived from this unless pinned larger)
# lock_escalation_threshold: 50           # shared-point locks before bucket escalation (> 0)
# lock_wait_deadline_ms: 500              # per-operation Serializable conflict cap (> 0)
# key_range_sharding: false               # opt tables into Kahuna key-range routing

# Unresolved-finalize budget. A COMMIT/ROLLBACK can come back "outcome not known yet" (a leadership
# flip mid-finalize, an in-progress drain, a participant write shed under load). That is not a
# failure and the write may already have landed, so the same finalize is retried on the same handle
# for this long before CADB0509 tells the client to retry it themselves. Raise it on saturated nodes,
# where each of those conditions takes longer in wall-clock without taking more attempts.
# transaction_finalize_retry_budget_ms: 15000  # total retry budget per finalize; <= 0 = attempt once

# Id-counter retry budget. Database ids, table ids, and the registry's cross-node generation stamp all
# come from persistent monotonic counters, and a call against one is refused while its Raft partition
# has no confirmed leader — a node still joining, or an election in flight. Every CREATE TABLE / VIEW /
# CTAS allocates an id first, so this budget is what decides whether an election is invisible or fails
# the statement with CADB0535. Sized against the election, which runs in seconds.
# sequence_retry_budget_ms: 10000  # total retry budget per counter call; <= 0 = attempt once

# Abandoned explicit-transaction reaper. A client that opens a transaction (/start-transaction)
# and never commits/rolls back would otherwise hold its locks indefinitely (a Serializable+RW
# transaction's heartbeat renews them forever). The reaper rolls back any explicit transaction
# idle — no statement issued — for longer than transaction_idle_timeout_ms.
# transaction_idle_timeout_ms: 300000     # idle cutoff before rollback; <= 0 disables the reaper
# transaction_reaper_interval_ms: 30000   # sweep interval; must be > 0

# Prepared statements. A gRPC handle dies with the BatchExecute stream that minted it, so it needs
# no timeout — only a per-stream cap. A REST handle has no such event to end it (HTTP connections are
# pooled, multiplexed and load-balanced), so it is scoped to this node and to the principal that
# prepared it, with an idle timeout as the backstop for clients that never close what they prepared.
# Exceeding a cap refuses the new PREPARE (CADB0521) rather than evicting a handle a client still
# holds. See docs/prepared-statements.md.
# Counting statements does not bound memory on its own — a cap of 512 permits 512 times whatever the
# largest request happens to be — so a per-statement size limit and retained-byte budgets bound the
# per-entry term as well. All of these are validated at startup: a negative value is a startup error,
# not a silently-unbounded limit.
# prepared_statement_idle_timeout_ms: 600000        # REST idle cutoff; <= 0 disables reaping
# prepared_statement_sweep_interval_ms: 60000       # reaper sweep interval; must be > 0
# grpc_max_prepared_statements_per_stream: 512      # per BatchExecute stream; 0 = unbounded
# rest_max_prepared_statements_per_principal: 512   # per principal on this node; 0 = unbounded
# rest_max_prepared_statements: 8192                # node-wide across principals; 0 = unbounded
# max_prepared_statement_bytes: 65536               # largest single statement, either transport
# grpc_max_prepared_statement_bytes_per_stream: 8388608       # 8 MiB retained per stream
# rest_max_prepared_statement_bytes_per_principal: 8388608    # 8 MiB retained per principal
# rest_max_prepared_statement_bytes: 67108864                 # 64 MiB retained per node

# ── Schema and transaction limits ─────────────────────────────────────────────
# max_index_columns: max key + INCLUDE columns in one index; <= 0 disables. Default 32.
# max_index_include_tuple_bytes: max encoded bytes of one index entry's key + INCLUDE tuple, checked
#   at write time; <= 0 disables. Default 4096 (4 KiB).
# max_mutations_per_transaction: max rows one user transaction may mutate; <= 0 disables (unlimited);
#   DDL/backfill always run unlimited. Default 20000.
# branch_snapshot_hold_lease_ms: lease window for a branch's snapshot-floor hold on its parent's MVCC
#   history (the leader-owned renewer renews well inside it); must be > 0. Default 300000 (5 min).
# max_index_columns: 32
# max_index_include_tuple_bytes: 4096
# max_mutations_per_transaction: 20000
# branch_snapshot_hold_lease_ms: 300000

# ── Advisory table statistics ─────────────────────────────────────────────────
# Row-count estimates are updated in memory on every DML and flushed to durable storage
# at most once per this interval (milliseconds), per table.
#   0  = flush after every change (highest durability, highest write amplification)
#   -1 = never auto-flush; persist only on explicit flush / database close
#   >0 = cap flush frequency to roughly once per interval per table (default 5000)
# stats_flush_interval_ms: 5000
#
# Manual ANALYZE tuning:
# stats_analyze_sample_rows: full-scan below this row count; sample the first N rows above it.
#   0 = always full scan. Default 100000.
# stats_histogram_buckets: equi-depth histogram buckets built per column (>= 1). Default 100.
# stats_analyze_sample_rows: 100000
# stats_histogram_buckets: 100

# ── Automatic (background) ANALYZE ────────────────────────────────────────────
# Keeps optimizer statistics fresh without a user running ANALYZE. Stays low-priority: it reads a
# lock-free snapshot (never blocks/aborts foreground work), bounds memory with sampling, throttles
# its scan rate, and backs off under load. On by default. See docs/automatic-analyze.md.
#
# auto_analyze_enabled: master switch. Default true; set false for manual-only ANALYZE.
# auto_analyze_check_interval_ms: sweep interval; only the registry leader sweeps (once per cluster).
#   <= 0 also disables the loop. Default 60000.
# auto_analyze_fraction_stale_rows: proportional trigger — stale once mutations reach
#   fraction*row_count + min_stale_rows (>= 0). Default 0.20.
# auto_analyze_min_stale_rows: absolute mutation floor before a table is ever stale (>= 0). Default 500.
# auto_analyze_max_concurrent: max background analyses at once on a node (>= 1). Default 1.
# auto_analyze_max_rows_per_second: scan-rate throttle (CPU/IO cap); <= 0 disables. Default 50000.
# auto_analyze_histogram_sample_rows: reservoir sample size per column — the memory bound (>= 1).
#   Default 10000.
# auto_analyze_hll_precision: HyperLogLog index bits for NDV sketches; register count 2^p (4..16).
#   Default 11 (~2 KB/column, ~2.3% error).
# auto_analyze_load_pause_threshold: in-flight foreground work above which the sweep backs off;
#   <= 0 disables load backoff. Default 16.
# auto_analyze_ownership_check_rows: rows between mid-scan ownership/load re-checks (>= 1). Default 1000.
# auto_analyze_enabled: true
# auto_analyze_check_interval_ms: 60000
# auto_analyze_fraction_stale_rows: 0.20
# auto_analyze_min_stale_rows: 500
# auto_analyze_max_concurrent: 1
# auto_analyze_max_rows_per_second: 50000
# auto_analyze_histogram_sample_rows: 10000
# auto_analyze_hll_precision: 11
# auto_analyze_load_pause_threshold: 16
# auto_analyze_ownership_check_rows: 1000

# ── Row-level TTL ─────────────────────────────────────────────────────────────
# Background sweep that deletes rows whose expiry column has passed. On by default, but a table only
# enters the sweep once it sets the ttl_expiration_expression storage parameter — a database with no
# TTL-configured table costs an idle poll and nothing else. Per-table tuning (cadence, batch sizes,
# rate limits, pause) lives on the table; the values below are only the fallback a table that sets
# nothing resolves to. See docs/row-level-ttl.md.
#
# ttl_enabled: master switch. Default true; set false to stop collecting expired rows node-wide.
# ttl_default_job_cron: fallback ttl_job_cron; @macro forms only. Default "@daily".
# ttl_default_select_batch_size: rows read per scan batch (> 0). Default 500.
# ttl_default_delete_batch_size: rows deleted per transaction (> 0). Default 100.
# ttl_default_select_rate_limit: scan rows/second; 0 = unlimited. Default 0.
# ttl_default_delete_rate_limit: delete rows/second; 0 = unlimited. Default 100.
# ttl_spans_per_table: spans a table's keyspace is split into per run (> 0). Default 64.
# ttl_max_concurrent_spans_per_node: spans one node processes at once (>= 1). Default 1.
# ttl_load_pause_threshold: in-flight foreground work above which the sweep pauses; <= 0 disables.
#   Default 16.
# ttl_span_lease_ms: lease on a claimed span (> 0). Default 30000.
# ttl_span_lease_renew_interval_ms: lease re-stamp cadence; must be well under the lease. Default 10000.
# ttl_enabled: true
# ttl_default_job_cron: "@daily"
# ttl_default_select_batch_size: 500
# ttl_default_delete_batch_size: 100
# ttl_default_select_rate_limit: 0
# ttl_default_delete_rate_limit: 100
# ttl_spans_per_table: 64
# ttl_max_concurrent_spans_per_node: 1
# ttl_load_pause_threshold: 16
# ttl_span_lease_ms: 30000
# ttl_span_lease_renew_interval_ms: 10000

# ── SQL parser AST cache ──────────────────────────────────────────────────────
# Identical SQL texts skip lexing+parsing on the second and later executions.
# sql_parser_cache_ttl_seconds: sliding TTL in seconds; 0 disables the cache. Default: 300.
# sql_parser_cache_max_entries: cap on distinct SQL texts; 0 = unbounded. Default: 2048.
# sql_parser_cache_sweep_seconds: background sweep interval; must be > 0. Default: 60.
# sql_parser_cache_ttl_seconds: 300
# sql_parser_cache_max_entries: 2048
# sql_parser_cache_sweep_seconds: 60

# ── Recoverable drops (deferred DROP + orphan reclamation) ────────────────────
# A non-FORCE DROP DATABASE/TABLE (root only) retains the object's data as a recoverable orphan,
# recoverable via CREATE ... RELINK TO '<id>' (see SHOW ORPHAN DATABASES / SHOW ORPHAN TABLES),
# until the background garbage collector reclaims it.
# orphan_retention_ms: how long an orphan stays recoverable before the GC may physically delete it;
#   <= 0 keeps orphans until an explicit DROP ... FORCE / manual purge. Default: 604800000 (7 days).
# orphan_reclaim_interval_ms: GC sweep interval; <= 0 disables the loop. Default: 300000 (5 min).
# orphan_retention_ms: 604800000
# orphan_reclaim_interval_ms: 300000

# ── Spill-to-disk ─────────────────────────────────────────────────────────────
# When spill_enabled is false (default), all blocking operators (sort, GROUP BY, DISTINCT,
# hash join, derived-table materialization, DELETE/UPDATE row buffers) keep their existing
# in-memory behavior. When true, each operator writes sorted runs or partitioned rows to
# temp files under {data_dir}/tmp/spill/ once its buffer exceeds spill_threshold_rows.
# Spill files are always deleted on operator completion, cancellation, or exception;
# orphaned files from a prior crash are swept on the next startup.
#
# spill_enabled: false            # gate all spill behavior; default false
# spill_threshold_rows: 500000    # per-operator row cap before spilling; must be > 0
# spill_merge_fan_in: 16          # max simultaneous run readers in a k-way merge; must be > 0

# ── Cost-based optimizer ──────────────────────────────────────────────────────
# Both cost-based switches are still opt-in. They engage on a DML-maintained row count alone, so a
# table that has never been ANALYZEd is costed without histograms or NDV and can be planned worse
# than the heuristic; auto_analyze_enabled fills those in only once a table passes
# auto_analyze_min_stale_rows.
# cost_based_access_path_enabled: false   # cost all index access paths, pick cheapest
# cost_based_join_order_enabled: false    # System-R DP join-order enumeration
# plan_cache_enabled: false               # SQL plan cache (reuse parsed+planned queries)
# plan_cache_max_entries: 512             # max LRU entries in the plan cache

# ── Regex match operators (~, ~*, !~, !~*) ────────────────────────────────────
# regex_match_timeout_ms: per-match timeout guarding against ReDoS on pathological patterns;
#   a match that exceeds it is rejected rather than allowed to run unbounded. Must be > 0.
# regex_cache_max_entries: max compiled patterns cached (keyed by pattern + case-sensitivity);
#   0 disables caching (patterns still compile+evaluate, just aren't retained).
# regex_match_timeout_ms: 250
# regex_cache_max_entries: 1024

# ── Query result cache ────────────────────────────────────────────────────────
# On by default; opt-in per query via a {cache=name} hint. Nothing without a hint is cached.
# See docs/query-result-cache.md for the full reference.
# query_result_cache_enabled: true              # master switch; set false to disable entirely
# query_result_cache_default_ttl_ms: 5000       # TTL for entries without a per-hint ttl=
# query_result_cache_max_entries: 1024          # entry-count cap (LRU beyond it)
# query_result_cache_max_bytes: 67108864        # total byte budget across entries (64 MiB)
# query_result_cache_max_entry_bytes: 1048576   # per-entry byte cap; larger results not stored
# query_result_cache_max_entry_rows: 10000      # per-entry row cap; larger results not stored
# query_result_cache_strict_validation_max_keys: 10000  # probe budget for strict validation
# query_result_cache_sweep_interval_ms: 10000   # background TTL-sweep interval

# ── Kahuna engine (cluster and standalone) ────────────────────────────────────
# Allow-listed passthrough to EmbeddedKahunaOptions. Omit the section or any key to
# keep the mode-specific CamusDB baseline. Both modes default to rocksdb for KV and WAL:
#   standalone — rocksdb for both KV and WAL.
#   cluster    — rocksdb for both KV and WAL, plus election 2000/4000 ms.
# Any key you set below overrides that baseline. Unknown keys are rejected at startup.
#
# Storage backends:
#   memory   — no persistence; data is lost on restart. Dev/test only.
#   sqlite   — per-partition files {storage_path}/kahuna{N}_{revision}.db (opt-in override).
#   rocksdb  — higher write throughput; directory tree under {storage_path}/{revision}/
#              (default for both modes; recommended for write-heavy workloads).
#
# wal_sync_writes (default true) fsyncs the WAL on every write for crash durability. On macOS/APFS
# an fsync is ~10 ms, so a write-heavy load (many autocommits, or a large batch whose commit is not
# group-fsynced) can be dominated by fsync latency. Set it false for dev/bulk loads to trade that
# durability for a large speedup; keep it true in production.
#
# The two knobs below raise write throughput WITHOUT giving up durability — the right lever when a
# concurrent write load is fsync-bound (each commit paying its own disk barrier):
#
# wal_group_commit_linger_ms (default 0 = off): a WAL worker briefly waits up to this many ms to gather
#   more ready commits into ONE group fsync, so many concurrent commits amortize a single disk barrier
#   instead of each fsyncing alone. Raises WAL batch density and throughput for a small, bounded latency
#   floor per commit; data is still fsync'd before a commit is acked. Try 1-2 for write-heavy loads.
# wal_single_fsync_commit (Kahuna embedded default false): removes one serial fsync from the commit
#   path — an auto-commit proposal acks once the propose quorum is durable and its commit marker rides
#   the next durable flush, without weakening durability. Recommended true for standalone write throughput.
#
# To opt out of the rocksdb default and use sqlite for both KV and WAL:
# kahuna:
#   storage: sqlite
#   wal_storage: sqlite
#
# kahuna:
#   storage: rocksdb             # memory | sqlite | rocksdb (default rocksdb)
#   storage_revision: v1
#   wal_storage: rocksdb          # memory | sqlite | rocksdb (default rocksdb)
#   wal_revision: v1
#   wal_sync_writes: true
#   wal_group_commit_linger_ms: 0
#   wal_single_fsync_commit: false
#   default_transaction_timeout_ms: 5000
#   max_transaction_timeout_ms: 3600000  # hard cap on any session timeout; must be >= max_serializable_transaction_lifetime_ms. Unset => derived from that lifetime so a long serializable txn is not clamped/reaped early
#   max_concurrent_sessions: 0           # 0 = no admission gate. For CamusDB this is a ceiling on concurrent WORK (a session per transaction), not on connections — see docs/transaction-priority.md
#   transaction_priority_reserved_slots: 0   # slots only High/Critical may occupy; effectively mandatory (>= 1) whenever a ceiling is set, or engine-internal work queues behind user traffic
#   transaction_priority_aging_threshold: 1000  # ms a waiter takes to gain one effective level; 0 disables aging and permits indefinite starvation
#   transaction_priority_max_queued: 4096    # queue DEPTH bound; beyond it, transactions are refused outright (retryable)
#   default_admission_wait_ms: 5000      # queue DURATION bound: how long a caller that asked for nothing waits at the door. Keep it short — this is not the session lifetime
#   max_admission_wait_ms: 30000         # hard clamp on any caller-supplied admission budget
#   locks_workers: 8
#   key_value_workers: 8
#   background_writer_workers: 1
#   read_io_threads: 8
#   write_io_threads: 8
#   start_election_timeout_ms: 2000    # must be < end_election_timeout_ms
#   end_election_timeout_ms: 4000
#   start_election_timeout_increment_ms: 100
#   end_election_timeout_increment_ms: 200
#   heartbeat_interval_ms: 500
#   voting_timeout_ms: 1500
#   max_entries_per_actor: 50000        # size-based eviction: cap on in-memory entries per actor.
#                                       # Unset => sized from RAM (see "memory-proportional defaults" below)
#   max_bytes_per_actor: 268435456      # size-based eviction: cap on in-memory bytes per actor (256 MiB).
#                                       # Unset => sized from RAM (see "memory-proportional defaults" below)
#   cache_entry_ttl_ms: 300000          # idle TTL before an aged cache entry may be evicted (5 min)
#   cache_entries_to_remove: 1000       # max aged entries evicted per collection sweep
#   collection_interval_ms: 60000       # background eviction-sweep + range-lock renewal cadence (60 s); range_lock_expires_ms must be >= 2x this
#   compact_every_operations: 1000      # take a Raft-log compaction point every N operations
#   compact_number_entries: 50          # trailing log entries retained at each compaction point
#   max_entries_per_compaction: 5000    # cap on entries removed by a single compaction pass
#
#   # RocksDB memory sharing (default: on whenever storage AND wal_storage are rocksdb;
#   # a no-op otherwise). One block cache + one write-buffer manager serve both databases,
#   # bounding total RocksDB memory with a single budget instead of two.
#   rocksdb_shared_memory: true                 # set false to give each database its own budget
#   rocksdb_shared_memory_budget_mb: 2048       # total shared block-cache budget (MiB); unset => 10% of RAM
#   rocksdb_shared_memtable_budget_mb: 512      # memtable sub-budget (MiB), charged INSIDE the total budget
#                                               # (not added to it); must be <= the total. Unset => a quarter of it
#
#   # Memory-proportional defaults. Any of the four cache knobs above that you leave UNSET is sized
#   # from the machine's available memory at startup (container limits respected), not left at a fixed
#   # value: block cache = 10% of RAM clamped to [320 MiB, 2 GiB]; memtable sub-budget = a quarter of
#   # the block cache clamped to [128 MiB, 1 GiB]; the key/value actor caches together take 6.25% of
#   # RAM (at least 64 MiB for the layer), split across kahuna.key_value_workers actors (default: one
#   # per CPU) and clamped to [8 MiB, 2 GiB] each -- adding cores splits that budget further rather
#   # than growing it -- with max_entries_per_actor derived at ~512 B/entry, clamped to [10k, 4M].
#   # That is roughly 16% of RAM across both cache layers, and never more than 4 GiB in total however
#   # large the machine is -- the defaults assume a shared developer workstation or CI container, not a
#   # dedicated server. Setting a key explicitly always wins over the computed value.
#   #
#   # Worked example, 8 GiB / 8-core machine, nothing set: block cache 819 MiB, memtable 204 MiB, actor
#   # caches 64 MiB x 8 = 512 MiB => ~1.5 GiB. The same 8 GiB box with 32 cores still spends 512 MiB on
#   # actor caches, at 16 MiB each. A dedicated database server should raise all four. To hand most of an
#   # 8 GiB machine to CamusDB, set them together and keep ~2.5 GiB for the CLR heap, RocksDB overhead
#   # outside the cache, and the OS:
#   #   rocksdb_shared_memory_budget_mb: 3584
#   #   rocksdb_shared_memtable_budget_mb: 896
#   #   max_bytes_per_actor: 134217728          # 128 MiB PER ACTOR -- multiply by key_value_workers
#   #   max_entries_per_actor: 262144
#   #
#   # Trap: rocksdb_shared_memtable_budget_mb must be <= rocksdb_shared_memory_budget_mb, and the two
#   # are validated AFTER merging with the computed defaults. Overriding only one of the pair can make
#   # the effective pair inconsistent (e.g. a 100 MiB total against a computed 512 MiB memtable) and
#   # fails startup with InvalidConfig. Always set both together.
#
#   # Backups & point-in-time recovery (opt-in; off unless backup_dir is set).
#   # When backup_dir is set, the server-admin backup/PITR API (/v1/backups/*, /v1/restore) is
#   # enabled and node-wide backups are written under this directory. It backs up ALL databases at
#   # once (they share one Kahuna node). Superuser-only when authentication is enabled.
#   backup_dir: /opt/camusdb/backups            # omit to DISABLE backups (default). Must not be blank when set
#   pitr_window_seconds: 3600                   # how far back live WAL is retained for recovery; > 0 and <= 21600 (6h). Default 3600 (1h)
#   base_snapshot_interval_seconds: 1800        # base-image cadence; > 0 and <= pitr_window_seconds. Default 1800 (30m)
#   # Restore is disabled unless a server-owned restore root is set (destinations are confined to it).
#   # /v1/restore refuses with RemoteRestoreDisabled until this is configured.
#   restore_root: /opt/camusdb/restores         # omit to keep restore disabled. Must not be blank when set
#   allow_unconfined_remote_restore: false      # true = allow restore to any absolute path (insecure). Default false
#   # Backup disk retention (garbage collection deletes only whole chains; also runs after each backup):
#   backup_retention_max_chains: 0              # keep at most N chains (0 = unlimited)
#   backup_retention_max_age_seconds: 0         # delete chains older than this (0 = unlimited)
#   backup_retention_max_bytes: 0               # cap total backup bytes (0 = unlimited)
#   backup_gc_interval_seconds: 3600            # background GC reaper cadence (0 = disabled). Default 3600 (1h)
#   backup_restore_throttle_bytes_per_sec: 0    # throttle a restore's checkpoint copy (0 = unlimited)
#   # Cluster + authenticity. Set the SAME value on every node. The backup root must be owner-only
#   # (0700) or backups fail with BackupInsecureRoot. Encryption-at-rest is not offered — keep backups
#   # on an access-controlled (ideally encrypted) volume.
#   backup_cluster_id: prod-cluster-a           # stamped into manifests; a restore refuses a foreign cluster's chain. Empty on standalone is fine
#   backup_mac_key_file: /etc/camusdb/backup.key # HMAC-SHA-256 key file signing manifests (authenticity). Same file on all nodes, kept outside backup_dir. Omit = unsigned

# ── Diagnostics (standalone only; opt-in) ─────────────────────────────────────
# Low-overhead OpenTelemetry metrics + sampled traces for performance diagnosis. Off by default:
# with enabled=false the server registers no exporter, endpoint, or collector and emits nothing.
# Effective only for a standalone node; cluster behavior is unchanged. The Prometheus endpoint
# exposes operational metadata — protect it or bind it to a trusted interface.
#
# enabled: master switch. Default false.
# prometheus_enabled: bind the Prometheus scrape endpoint on the HTTP listener. Default false.
# prometheus_path: path for the scrape endpoint; must start with '/'. Default /metrics.
# otlp_endpoint: optional OTLP collector URL; its presence enables the OTLP push exporter.
# trace_sample_ratio: head sampling ratio in [0, 1]. Default 0.01 (1%).
# include_runtime_metrics: also export .NET runtime metrics (GC, thread-pool). Default true.
#
# diagnostics:
#   enabled: false
#   prometheus_enabled: false
#   prometheus_path: /metrics
#   otlp_endpoint:
#   trace_sample_ratio: 0.01
#   include_runtime_metrics: true
