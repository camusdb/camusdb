# CamusDB configuration reference
#
# Precedence (highest wins): CLI flag > environment variable > config.yml > built-in default.
# Only explicitly provided CLI flags override YAML — omitting a flag keeps the YAML value.
#
# Environment overrides:
#   CAMUS_KEY_RANGE_SHARDING — when set to 1 or true, enables key_range_sharding regardless of YAML.

data_dir: /tmp/camusdb/

# ── Server mode ───────────────────────────────────────────────────────────────
# mode: standalone         # standalone | cluster
# node_name: camus-node-1  # cluster: unique node name (defaults to machine name)
# raft_node_id: 1          # cluster: numeric Raft node id (> 0)
# raft_host: localhost     # cluster: Raft bind/advertise host
# raft_port: 7070          # cluster: Raft gRPC port (1..65535)
initial_partitions: 3      # cluster: Raft partition count (>= 1)
# http_port: 5095          # HTTP API port (1..65535)
# https_port: 7141         # HTTPS API port when https_certificate is set (1..65535)
# https_certificate:       # path to PFX for HTTPS; omit to disable HTTPS
# raft_certificate:        # path to PFX for Raft gRPC TLS in cluster mode

# Cluster mode example (uncomment and fill in)
# mode: cluster
# node_name: camus-node-1
# raft_host: 192.168.1.10
# raft_port: 7070
# initial_partitions: 3
#
# peers: Raft endpoint list.  Each entry MUST be "host:raftPort" exactly as Raft
# reports it — the endpoint-map lookup is a byte-exact string match against the
# leader endpoint string returned by Raft.WaitForLeader().  A mismatch causes a
# silent fallback to the uniform-port heuristic (logged at Warning level).
# peers:
#   - 192.168.1.10:7070
#   - 192.168.1.11:7070
#   - 192.168.1.12:7070
#
# Per-peer HTTP addresses (parallel to peers, same index order).
# Required for heterogeneous HTTP ports or multiple nodes per host.
# If omitted, the leader's host is reused with this node's http_port (uniform-port assumption).
# http_peers:
#   - 192.168.1.10:5095
#   - 192.168.1.11:5095
#   - 192.168.1.12:5095
#
# Schema two-version gate tunables (cluster mode). A DDL proposer waits for every
# live node to ack the previous schema version before proposing the next.
# schema_ack_wait_timeout_ms: how long to wait for all acks before giving up (> 0).
# schema_ack_live_node_lease_ms: how long since a member's last ack before the gate
#   presumes it down and stops blocking on it. -1 = infinite (conservative default:
#   wait on every member); a positive value enables apply-derived liveness expiry.
# schema_ack_wait_timeout_ms: 30000
# schema_ack_live_node_lease_ms: -1

# ── Isolation and locking ─────────────────────────────────────────────────────
# default_isolation_level: serializable   # serializable | read_committed
# range_lock_expires_ms: 30000            # range-lock TTL; <= 0 = no expiry
# range_lock_heartbeat_interval_ms: 10000 # must be < range_lock_expires_ms when expiry enabled
# max_serializable_transaction_lifetime_ms: 3600000  # <= 0 disables absolute cap
# lock_escalation_threshold: 50           # shared-point locks before bucket escalation (> 0)
# lock_wait_deadline_ms: 500              # per-operation Serializable conflict cap (> 0)
# key_range_sharding: false               # opt tables into Kahuna key-range routing

# ── Advisory table statistics ─────────────────────────────────────────────────
# Row-count estimates are updated in memory on every DML and flushed to durable storage
# at most once per this interval (milliseconds), per table.
#   0  = flush after every change (highest durability, highest write amplification)
#   -1 = never auto-flush; persist only on explicit flush / database close
#   >0 = cap flush frequency to roughly once per interval per table (default 5000)
# stats_flush_interval_ms: 5000

# ── SQL parser AST cache ──────────────────────────────────────────────────────
# Identical SQL texts skip lexing+parsing on the second and later executions.
# sql_parser_cache_ttl_seconds: sliding TTL in seconds; 0 disables the cache. Default: 300.
# sql_parser_cache_max_entries: cap on distinct SQL texts; 0 = unbounded. Default: 2048.
# sql_parser_cache_sweep_seconds: background sweep interval; must be > 0. Default: 60.
# sql_parser_cache_ttl_seconds: 300
# sql_parser_cache_max_entries: 2048
# sql_parser_cache_sweep_seconds: 60

# ── Spill-to-disk ─────────────────────────────────────────────────────────────
# When spill_enabled is false (default), all blocking operators (sort, GROUP BY, DISTINCT,
# hash join, derived-table materialization, DELETE/UPDATE row buffers) keep their existing
# in-memory behavior. When true, each operator writes sorted runs or partitioned rows to
# temp files under {data_dir}/tmp/spill/ once its buffer exceeds spill_threshold_rows.
# Spill files are always deleted on operator completion, cancellation, or exception;
# orphaned files from a prior crash are swept on the next startup.
#
# spill_enabled: false            # gate all spill behavior; default false
# spill_threshold_rows: 500000    # per-operator row cap before spilling; must be > 0
# spill_merge_fan_in: 16          # max simultaneous run readers in a k-way merge; must be > 0

# ── Cost-based optimizer ──────────────────────────────────────────────────────
# cost_based_access_path_enabled: false   # cost all index access paths, pick cheapest
# cost_based_join_order_enabled: false    # System-R DP join-order enumeration
# plan_cache_enabled: false               # SQL plan cache (reuse parsed+planned queries)
# plan_cache_max_entries: 512             # max LRU entries in the plan cache

# ── Kahuna engine (cluster and standalone) ────────────────────────────────────
# Allow-listed passthrough to EmbeddedKahunaOptions. Omit the section or any key to
# keep the mode-specific CamusDB baseline (cluster: sqlite + election 2000/4000 ms;
# standalone: sqlite per-database node). Unknown keys are rejected at startup.
#
# Storage backends:
#   memory   — no persistence; data is lost on restart. Dev/test only.
#   sqlite   — default; per-partition files {storage_path}/kahuna{N}_{revision}.db
#   rocksdb  — higher write throughput; directory tree under {storage_path}/{revision}/
#              Recommended for standalone nodes with write-heavy workloads.
#
# To enable RocksDB for both KV and WAL, uncomment:
# kahuna:
#   storage: rocksdb
#   wal_storage: rocksdb
#
# kahuna:
#   storage: sqlite              # memory | sqlite | rocksdb
#   storage_revision: v1
#   wal_storage: sqlite           # memory | sqlite | rocksdb
#   wal_revision: v1
#   wal_sync_writes: true
#   default_transaction_timeout_ms: 5000
#   locks_workers: 8
#   key_value_workers: 8
#   background_writer_workers: 1
#   read_io_threads: 8
#   write_io_threads: 8
#   start_election_timeout_ms: 2000    # must be < end_election_timeout_ms
#   end_election_timeout_ms: 4000
#   start_election_timeout_increment_ms: 100
#   end_election_timeout_increment_ms: 200
#   heartbeat_interval_ms: 500
#   voting_timeout_ms: 1500
#   max_entries_per_actor: 50000
#   max_bytes_per_actor: 268435456
#   compact_every_operations: 1000
